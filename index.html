<body class="bg-orange-50 p-4">

<div id="loginScreen">

บันทึก

class="mt-2 w-full bg-blue-500 text-white p-3 rounded">

<script>
const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz5xPoN-szDNb4EwcSsHlvjJslDdcPQ-22Mwhf8V0XHBXdRLwQmT7rimCDnFcNp0bztDw/exec";
let isSaving = false;
let hasShownPopup = false;
let checkerName = "";

function updateUIByMode(){

  const inputs = document.querySelectorAll("#tbody input");
  let hasValue = false;

  inputs.forEach(input=>{
    if(input.value !== "") hasValue = true;
  });

  if(hasValue){
    if(!confirm("มีข้อมูลที่ยังไม่ได้บันทึก ต้องการเปลี่ยนโหมดหรือไม่?")){
      return;
    }
  }

  const mode = document.getElementById("mode").value;
  const button = document.querySelector("button[onclick='save()']");

  if(mode === "check"){
    button.innerText = "บันทึก (เช็คสต๊อก)";
  }
  else if(mode === "in"){
    button.innerText = "บันทึก (รับสินค้าเข้า)";
  }
  else{
    button.innerText = "บันทึก (ใช้สินค้า)";
  }

  clearInputs();
}
  
// ข้อมูลสินค้า (พร้อมวงเล็บ)
const data = {
"นับทุกวัน":["ใบกะเพรา (ไม่พอใส่ 0)","เนื้อทำข้าวหน้าเนื้อ (ชิ้น)","บะหมี่เหลือง (ห่อ)","หมูยอ (ก้อน)","โหระพา (ไม่พอใส่ 0)","ผักชีใบเลื่อย (ไม่พอใส่ 0)","ไข่ (แผง)","ขนมปังไข่กระทะ (ก้อน)","ต้นหอม (ไม่พอใส่ 0)","ผักสลัด (หัว)","น้ำถัง (ถัง)","ขนมปังแซนวิช (แผ่น)","ขนมปังซาวโดว์ (แผ่น)","แฮม (แผ่น)","ชีส (แผ่น)","เบค่อน (เส้น)","ไส้กรอก (ชิ้น)","มะเขือเทศ (ลูก)","อโวคาโด้ (ลูก)","กุ้ง (แพ็ค)","เส้นสปาเก็ตตี้ (แพ็ค)","วิปครีม (กล่อง)","พาเมซานชีส (ถุง)"],
"นับวันจันทร์":["น้ำมันเนื้อ (แพ็ค)","เนยจืด (ไม่พอใส่ 0)","เนยเค็ม (ไม่พอใส่ 0)","อกไก่แช่แข็ง (แพ็ค)","ไก่สับ (แพ็ค)","แตงกวา (ลูก)"],
"นับวันอังคาร":["ถั่วงอก (ไม่พอใส่ 0)","พริก (แพ็ค)","กระเทียม (แพ็ค)","พริกแห้ง (แพ็ค)","หมูสับ (แพ็ค)","แครอท (หัว)"],
"นับวันพุธ":["มันเจียว (แพ็ค)","เนื้อเจียว (แพ็ค)","กระเทียมแผ่น (ห่อ)","ตะเกียบ (แพ็ค)","หมูบดแช่แข็ง (แพ็ค)","น้ำมันพริก หอมเจียว (ไม่พอใส่ 0)","แตงกวา (ลูก)"],
"นับวันพฤหัส":["เนื้อสับ (แพ็ค)","เนื้อตุ๋น (แพ็ค)","ข้าวสาร (ถัง)","เฟรนฟราย (ห่อ)","เอบิโรล (ถาด)","นักเก็ต (ถุง)","โดนัทกุ้ง (แพ็ค)","ซอสชีส (ไม่พอใส่ 0)","มายองเนส (ไม่พอใส่ 0)","ไข่กุ้ง (ไม่พอใส่ 0)","น้ำจิ้มบ๋วย (ไม่พอใส่ 0)","น้ำสลัดญี่ปุ่น (ไม่พอใส่ 0)"],
"นับวันศุกร์":["หมูตุ๋น (แพ็ค)","ช้อน-ส้อม พลาสติก (แพ็ค)","กล่องข้าว (แพ็ค)","ถุงใส่กล่องข้าว (แพ็ค)","กระดาษรองกล่องข้าว (แพ็ค)","ถ้วยข้าวต้ม (ใบ)","ถ้วยไข่ลวก (ใบ)","กล่องใส่สปาเก็ตตี้ (10 ใบ)"],
"นับวันเสาร์":["ซอสพริก (ถุง)","ซอสมะเขือเทศ (ถุง)","ซอยหอยนางรม (ขวด)","ซอสฝาเขียว (ขวด)","น้ำตาลทรายขาว (ห่อ)","รสดีหมู (ห่อ)","พริกไทยป่น (ห่อ)","ผงชูรส (ห่อ)","เกลือ (ห่อ)","น้ำมันพืช (ถัง)","ซอสมะเขือเทศซอง (ถุง)","ซอสพริกซอง (ถุง)","น้ำปลาพริกถุงเล็ก (แพ็ค)","แผ่นเกี๊ยว (ห่อ)","กุนเชียง (แท่ง)","กล่องใส่แซนวิช ซาวโดว์ (ใบ)","แม็กกี้ซอง (ซอง)","แม็กกี้ขวดเล็ก (ขวด)","ฟ้าไทย สีเขียว (ห่อ)"],
"นับวันอาทิตย์":["ซอสกะเพรา (ไม่พอใส่ 0)","ผงข้าวผัด (ไม่พอใส่ 0)","ผงข้าวต้ม (ไม่พอใส่ 0)","มันเจียว (แพ็ค)","เนื้อเจียว (แพ็ค)","แครอท (หัว)","เส้นเล็ก (ก้อน)","มาม่า (ก้อน)","พริกเผา ฉั่วฮะเส็ง (ห่อ)","พริกเผา แม่ประนอม (กระปุก)","คนอร์ ต้มยำ (ก้อน)","เต้าหู้ (แท่ง)","มะนาว (ลูก)"]
};

function enterSystem(){
  const name=document.getElementById("checkerNameInput").value.trim();
  if(!name){ alert("กรุณากรอกชื่อผู้เช็ค"); return; }
  checkerName=name;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("mainScreen").style.display="block";
  renderItems();
  loadLowStock();
  setInterval(loadLowStock, 30000);
}

function renderItems(){

  const cat = document.getElementById("category").value;
  const search = document.getElementById("searchInput").value.toLowerCase();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  let items = [];

  if(search !== ""){
    Object.values(data).forEach(arr=>{
      items = items.concat(arr);
    });
    items = [...new Set(items)];
  }
  else{
    items = data[cat] || [];
  }

  const filtered = items.filter(item =>
    item.toLowerCase().includes(search)
  );

  if(filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="3" class="text-center p-2 text-gray-500">ไม่พบสินค้า</td></tr>`;
    return;
  }

  filtered.forEach((item,index)=>{
    tbody.innerHTML += `
      <tr>
        <td class="p-2">${item}</td>
        <td class="p-2">
          <input type="number" step="0.5" class="w-full border p-1" min="0">
        </td>
        <td class="p-2 alert" id="alert-${item.replace(/\s/g,'')}-${index}"></td>
      </tr>
    `;
  });
}
function loadLowStock(){

  fetch(GOOGLE_SHEET_WEBAPP_URL)
    .then(res => res.json())
    .then(data => {

      const box = document.getElementById("lowStockAlert");

      if(!data || data.length === 0){
        box.style.display = "none";
        return;
      }

      let html = "⚠️ สินค้าใกล้หมด:<br>";
      let popupText = "⚠️ สินค้าใกล้หมด!\n";

      data.forEach(item=>{
        html += `- ${item.name} (เหลือ ${item.remain} / ขั้นต่ำ ${item.min})<br>`;
        popupText += `- ${item.name} (เหลือ ${item.remain} / ขั้นต่ำ ${item.min})\n`;
      });

      box.innerHTML = html;
      box.style.display = "block";

      if(!hasShownPopup){
        alert(popupText);
        hasShownPopup = true;
      }

    });
}
function clearInputs(){
  const inputs = document.querySelectorAll("#tbody input");
  inputs.forEach(input=>{
    input.value = "";
  });
}
function changeCategory(){

  // 1. ดึง input ทุกช่อง
  const inputs = document.querySelectorAll("#tbody input");

  // 2. เช็คว่ามีคนกรอกหรือยัง
  let hasValue = false;

  inputs.forEach(input=>{
    if(input.value !== ""){
      hasValue = true;
    }
  });

  // 3. ถ้ามีข้อมูล → เตือนก่อน
  if(hasValue){
    const confirmChange = confirm("มีข้อมูลที่ยังไม่ได้บันทึก ต้องการเปลี่ยนหมวดหรือไม่?");

    // ❌ ถ้ากด Cancel → หยุดทันที
    if(!confirmChange){
      return;
    }
  }

  // 4. ถ้ากด OK → โหลดรายการใหม่
  renderItems();

  // 5. ล้างช่อง (กันค่าค้าง)
  clearInputs();
}
function save(){
  if(isSaving){
  alert("กำลังบันทึกอยู่...");
  return;
  }
  isSaving = true;

  console.log("🔥 กดบันทึกแล้ว");

  const btn = document.getElementById("saveBtn");
  const status = document.getElementById("statusText");

  const mode = document.getElementById("mode").value;
  const category = document.getElementById("category").value;

  const inputs = document.querySelectorAll("#tbody input");

  let result = [];

  inputs.forEach(input => {

    const value = input.value;
    const item = input.closest("tr").children[0].innerText;

    if(value !== ""){
      result.push({
        name: item,
        qty: Number(value)
      });
    }

  });

  console.log("ข้อมูลที่จะส่ง:", result);

  if(result.length === 0){
  alert("กรุณากรอกข้อมูลก่อนบันทึก");
  isSaving = false;
  return;
}
  // ======================
// 🔍 สรุปก่อนบันทึก
// ======================

let summary = "คุณกำลังจะบันทึก:\n\n";

if(mode === "in") summary += "📥 รับสินค้าเข้า\n";
else if(mode === "out") summary += "📤 ใช้สินค้า\n";
else summary += "📊 เช็คสต๊อก\n";

result.forEach(item=>{
  summary += `- ${item.name} = ${item.qty}\n`;
});

// 🔥 popup ยืนยัน
const confirmSave = confirm(summary + "\nยืนยันหรือไม่?");

if(!confirmSave){
  isSaving = false; // 🔥 สำคัญมาก
  return;
}

  // 🔄 เริ่มบันทึก
  btn.disabled = true;
  btn.innerText = "กำลังบันทึก...";
  status.innerText = "🔄 กำลังบันทึก...";

  fetch(GOOGLE_SHEET_WEBAPP_URL,{
    method:"POST",
    body:JSON.stringify({
      category: category,
      checker_name: checkerName,
      mode: mode,
      items: result
    })
  })
  .then(res => res.text())
  .then(res=>{
    isSaving = false;
    console.log("ผลลัพธ์จาก server:", res);

    // ✅ สำเร็จ
    status.innerText = "✅ บันทึกสำเร็จ";
    btn.disabled = false;
    btn.innerText = "บันทึก";

    clearInputs();
    hasShownPopup = false; // 🔥 เพิ่มบรรทัดนี้
    loadLowStock(); // ✅ อัปเดตแจ้งเตือนทันที

    setTimeout(()=>{
      status.innerText = "";
    },2000);

  })
  .catch(err=>{
    isSaving = false;

    // ❌ error
    status.innerText = "❌ บันทึกไม่สำเร็จ";
    btn.disabled = false;
    btn.innerText = "บันทึก";
  });

}
  function openToday(){

  document.getElementById("mainScreen").style.display = "none";
  document.getElementById("todayScreen").style.display = "block";

  loadTodayData();
}

function backToMain(){
  document.getElementById("todayScreen").style.display = "none";
  document.getElementById("mainScreen").style.display = "block";
}

function loadTodayData(type = "today"){

  const box = document.getElementById("todayList");
  const loading = document.getElementById("loadingBox");

  // ✅ highlight ปุ่ม
  setActiveTab(type);

  // ✅ ป้องกันกดรัว
  disableTabs(true);

  // ✅ show loading
  loading.style.display = "block";
  box.innerHTML = "";

  fetch(GOOGLE_SHEET_WEBAPP_URL + "?type=" + type)
    .then(res => res.json())
    .then(data => {

      loading.style.display = "none";
      disableTabs(false);

      if(!data || data.length === 0){
        box.innerHTML = "ไม่มีข้อมูล";
        return;
      }

      let html = `
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#fde68a;">
            <th>วันที่</th>
            <th>เวลา</th>
            <th>สินค้า</th>
            <th>ประเภท</th>
            <th>จำนวน</th>
            <th>ผู้เช็ค</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody>
      `;

      data.forEach(item => {

        let modeText = "";

        if(item.mode === "in") modeText = "📥 รับเข้า";
        else if(item.mode === "out") modeText = "📤 ใช้ออก";
        else modeText = "📊 เช็ค";

        html += `
          <tr>
            <td>${item.date}</td>
            <td>${item.time}</td>
            <td>${item.name}</td>
            <td>${modeText}</td>
            <td>${item.qty}</td>
            <td>${item.checker_name}</td>
            <td>
              <button onclick="openEditPopup('${item.id}','${item.name}',${item.qty},'${item.mode}')"
              style="background:#f59e0b;color:white;padding:5px;border-radius:5px;margin-right:5px;">
              แก้
              </button>

              <button onclick="deleteTransaction('${item.id}')"
              style="background:#ef4444;color:white;padding:5px;border-radius:5px;">
              ลบ
              </button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      box.innerHTML = html;

    })
    .catch(err => {

      loading.style.display = "none";
      disableTabs(false);

      console.log(err);
      box.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ";
    });
}
function editTransaction(id,name,oldQty,oldMode){

  const newMode = prompt(
`แก้โหมดของ ${name}
พิมพ์:
in = รับเข้า
out = ใช้ออก
check = เช็คสต๊อก`,
    oldMode
  );

  if(newMode === null) return;

  const cleanMode = newMode.trim().toLowerCase();

  if(!["in","out","check"].includes(cleanMode)){
    alert("โหมดไม่ถูกต้อง");
    return;
  }

  const newQty = prompt(
    `แก้จำนวน ${name}\nเดิม: ${oldQty}`,
    oldQty
  );

  if(newQty === null) return;

  const qty = Number(newQty);

  if(isNaN(qty)){
    alert("กรุณากรอกตัวเลข");
    return;
  }

fetch(GOOGLE_SHEET_WEBAPP_URL, {
  method: "POST",
  mode: "no-cors",
  body: JSON.stringify({
    checker_name: checkerName,
    mode: cleanMode,
    category: "แก้ย้อนหลัง",
    fix_id: id,
    items: [
      {
        name: name,
        qty: qty
      }
    ]
  })
})
.then(() => {
  alert("ส่งคำแก้ไขแล้ว (กำลังอัปเดตข้อมูล)");
  loadTodayData("today");
  loadLowStock();
})
.catch(err => {
  console.log(err);
  alert("แก้ไขไม่สำเร็จ (network error)");
});

}
  function editItem(name, qty){

  document.getElementById("mode").value = "check";
  updateUIByMode();

  document.getElementById("searchInput").value = name;
  renderItems();

  setTimeout(()=>{
    const inputs = document.querySelectorAll("#tbody input");

    inputs.forEach(input=>{
      const itemName = input.closest("tr").children[0].innerText;

      if(itemName === name){
        input.value = qty;
      }
    });
  },300);
}
function deleteTransaction(id){

  const confirmDelete = confirm("ต้องการลบรายการนี้ใช่ไหม?");

  if(!confirmDelete) return;

  fetch(GOOGLE_SHEET_WEBAPP_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      id: id
    })
  })
  .then(res => res.text())
  .then(res => {
    alert("ลบรายการแล้ว");
    loadTodayData();
    loadLowStock();
  })
  .catch(err => {
    console.log(err);
    alert("ลบไม่สำเร็จ");
  });

}
function setActiveTab(type){

  document.getElementById("btn-today").classList.remove("tab-active");
  document.getElementById("btn-yesterday").classList.remove("tab-active");
  document.getElementById("btn-all").classList.remove("tab-active");

  if(type === "today") document.getElementById("btn-today").classList.add("tab-active");
  if(type === "yesterday") document.getElementById("btn-yesterday").classList.add("tab-active");
  if(type === "all") document.getElementById("btn-all").classList.add("tab-active");
}
function disableTabs(state){

  const btns = [
    document.getElementById("btn-today"),
    document.getElementById("btn-yesterday"),
    document.getElementById("btn-all")
  ];

  btns.forEach(btn=>{
    if(!btn) return;

    if(state){
      btn.style.pointerEvents = "none";
      btn.style.opacity = "0.5";
    } else {
      btn.style.pointerEvents = "auto";
      btn.style.opacity = "1";
    }
  });
}
