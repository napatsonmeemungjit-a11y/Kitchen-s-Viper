<div id="loginScreen">

  background:#ffcccc;
  padding:10px;
  margin-bottom:10px;

"></div>

<select id="mode" class="border p-2 mb-2 w-full" onchange="updateUIByMode()">
  <option value="check">📊 เช็คสต๊อก (เดิม)</option>
  <option value="in">📥 รับสินค้าเข้า</option>
  <option value="out">📤 ใช้/เบิกสินค้า</option>
</select>  
  
<select id="category" class="border p-2 mb-4 w-full" onchange="changeCategory()">

  <option value="นับวันจันทร์">นับวันจันทร์</option>
  <option value="นับวันอังคาร">นับวันอังคาร</option>
  <option value="นับวันพุธ">นับวันพุธ</option>
  <option value="นับวันพฤหัส">นับวันพฤหัส</option>
  <option value="นับวันศุกร์">นับวันศุกร์</option>
  <option value="นับวันเสาร์">นับวันเสาร์</option>
  <option value="นับวันอาทิตย์">นับวันอาทิตย์</option>
</select>

<input 
  type="text" 
  id="searchInput" 
  placeholder="🔍 ค้นหาสินค้า..." 
  class="border p-2 mb-2 w-full"
  oninput="renderItems()"
>
<table class="w-full bg-white rounded shadow">
<thead>
<tr class="bg-orange-200">
<th class="p-2">รายการ</th>
<th class="p-2">จำนวน</th>
<th class="p-2">แจ้งเตือน</th>
</tr>
</thead>

<button onclick="save()" class="mt-4 w-full bg-green-500 text-white p-3 rounded">บันทึก</button>
</div>

function updateUIByMode(){

  const inputs = document.querySelectorAll("#tbody input");
  let hasValue = false;

  inputs.forEach(input=>{
    if(input.value !== "") hasValue = true;
  });

  if(hasValue){
    if(!confirm("มีข้อมูลที่ยังไม่ได้บันทึก ต้องการเปลี่ยนโหมดหรือไม่?")){
      return;
    }
  }

  const mode = document.getElementById("mode").value;
  const button = document.querySelector("button[onclick='save()']");

  if(mode === "check"){
    button.innerText = "บันทึก (เช็คสต๊อก)";
  }
  else if(mode === "in"){
    button.innerText = "บันทึก (รับสินค้าเข้า)";
  }
  else{
    button.innerText = "บันทึก (ใช้สินค้า)";
  }

  clearInputs();
}

// จำนวนขั้นต่ำแจ้งเตือน

"น้ำมันเนื้อ":2,"เนยจืด":0,"เนยเค็ม":0,"อกไก่แช่แข็ง":2,"ไก่สับ":30,"แตงกวา":3,
"ถั่วงอก":0,"พริก":2,"กระเทียม":2,"พริกแห้ง":3,"หมูสับ":30,"แครอท":2,
"มันเจียว":2,"เนื้อเจียว":2,"กระเทียมแผ่น":1,"ตะเกียบ":1,"หมูบดแช่แข็ง":2,"น้ำมันพริก หอมเจียว":0,"แตงกวา":3,
"เนื้อสับ":30,"เนื้อตุ๋น":30,"ข้าวสาร":0.5,"เฟรนฟราย":1,"เอบิโรล":1,"นักเก็ต":1,"โดนัทกุ้ง":2,"ซอสชีส":0,"มายองเนส":0,"ไข่กุ้ง":0,"น้ำจิ้มบ๋วย":0,"น้ำสลัดญี่ปุ่น":0,
"หมูตุ๋น":30,"ช้อน-ส้อม พลาสติก":0,"กล่องข้าว":1,"ถุงใส่กล่องข้าว":2,"กระดาษรองกล่องข้าว":1,"ถ้วยข้าวต้ม":10,"ถ้วยไข่ลวก":10,"กล่องใส่สปาเก็ตตี้":10,
"ซอสพริก":1,"ซอสมะเขือเทศ":1,"ซอยหอยนางรม":1,"ซอสฝาเขียว":1,"น้ำตาลทรายขาว":1,"รสดีหมู":1,"พริกไทยป่น":0.5,"ผงชูรส":0.5,"เกลือ":0.5,"น้ำมันพืช":3,"ซอสมะเขือเทศซอง":1,"ซอสพริกซอง":1,"น้ำปลาพริกถุงเล็ก":1,"แผ่นเกี๊ยว":1,"กุนเชียง":2,"กล่องใส่แซนวิช ซาวโดว์":10,"แม็กกี้ซอง":10,"แม็กกี้ขวดเล็ก":0,"ฟ้าไทย สีเขียว":0.5,
"ซอสกะเพรา":0,"ผงข้าวผัด":0,"ผงข้าวต้ม":0,"มันเจียว":1,"เนื้อเจียว":1,"แครอท":2,"เส้นเล็ก":10,"มาม่า":10,"พริกเผา ฉั่วฮะเส็ง":1,"พริกเผา แม่ประนอม":0.5,"คนอร์ ต้มยำ":5,"เต้าหู้":9,"มะนาว":5
};

function enterSystem(){
  const name=document.getElementById("checkerNameInput").value.trim();
  if(!name){ alert("กรุณากรอกชื่อผู้เช็ค"); return; }
  checkerName=name;
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("mainScreen").style.display="block";
  renderItems();
  loadLowStock();
}

function renderItems(){

  const cat = document.getElementById("category").value;
  const search = document.getElementById("searchInput").value.toLowerCase();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  let items = [];
  // 🔥 รวม + ลบซ้ำ
  if(search !== ""){
   Object.values(data).forEach(arr=>{
    items = items.concat(arr);
   });

   // 👇 เพิ่มตรงนี้
   items = [...new Set(items)];
  }
  else{
   items = data[cat] || [];
}
    

  // 🔍 filter
  const filtered = items.filter(item =>
    item.toLowerCase().includes(search)
  );

  if(filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="3" class="text-center p-2 text-gray-500">ไม่พบสินค้า</td></tr>`;
    return;
  }

  filtered.forEach(item=>{
    tbody.innerHTML += `
      <tr>
        <td class="p-2">${item}</td>
        <td class="p-2"><input type="number" class="w-full border p-1" min="0"></td>
        <td class="p-2 alert" id="alert-${item.replace(/\s/g,'')}"></td>
      </tr>
    `;
  });
}

function loadLowStock(){

  fetch(GOOGLE_SHEET_WEBAPP_URL)
    .then(res => res.json())
    .then(data => {

      const box = document.getElementById("lowStockAlert");

      if(!data || data.length === 0){
        box.style.display = "none";
        return;
      }

      let html = "⚠️ สินค้าใกล้หมด:<br>";
      let popupText = "⚠️ สินค้าใกล้หมด!\n";

      data.forEach(item=>{
        html += `- ${item.name} (เหลือ ${item.remain})<br>`;
        popupText += `- ${item.name} (เหลือ ${item.remain})\n`;
      });

      box.innerHTML = html;
      box.style.display = "block";

      if(!hasShownPopup){
        alert(popupText);
        hasShownPopup = true;
      }

    });
}
function clearInputs(){
  const inputs = document.querySelectorAll("#tbody input");
  inputs.forEach(input=>{
    input.value = "";
  });
}
function changeCategory(){

  // 1. ดึง input ทุกช่อง
  const inputs = document.querySelectorAll("#tbody input");

  // 2. เช็คว่ามีคนกรอกหรือยัง
  let hasValue = false;

  inputs.forEach(input=>{
    if(input.value !== ""){
      hasValue = true;
    }
  });

  // 3. ถ้ามีข้อมูล → เตือนก่อน
  if(hasValue){
    const confirmChange = confirm("มีข้อมูลที่ยังไม่ได้บันทึก ต้องการเปลี่ยนหมวดหรือไม่?");

    // ❌ ถ้ากด Cancel → หยุดทันที
    if(!confirmChange){
      return;
    }
  }

  // 4. ถ้ากด OK → โหลดรายการใหม่
  renderItems();

  // 5. ล้างช่อง (กันค่าค้าง)
  clearInputs();
}
</script>
